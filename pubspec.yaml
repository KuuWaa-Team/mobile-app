name: kuuwaa
description: Music event creat and booking flutter app

publish_to: 'none'
version: 1.0.14+15

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_datetime_picker:
  cupertino_icons: ^1.0.2               # For ios icons
  fluttertoast: ^8.0.8                  # For show toast massage
  shared_preferences: ^2.0.12           # For save data in locale
  flutter_spinkit: ^5.1.0               # For loader
  page_transition: "^2.0.9"
  another_flushbar: ^1.12.29
  mask_text_input_formatter: ^2.4.0
  flutter_cupertino_datetime_picker: ^3.0.0
  flex_color_picker: ^3.3.0
  flutter_datetime_picker_plus: ^2.1.0
  flutter_social_button: ^1.1.6+1
  flutter_cupertino_date_picker_fork: ^1.0.7
  font_awesome_flutter: ^10.6.0
  google_sign_in: ^6.0.0
  sms_autofill: ^2.3.0
  intl_translation: any
  share_plus: ^11.0.0
  provider: ^6.0.5
  shimmer: ^3.0.0
  timer_count_down: ^2.2.2
  flutter_launcher_icons: ^0.13.1
  intl: ^0.19.0                         # For Date and Time
  crypto: ^3.0.1                        # For encrypt and decrypt data
  url_launcher: ^6.0.18
  flutter_native_splash: ^2.2.18
  http: ^0.13.5
  firebase_core: ^3.12.1
  sign_in_button: ^3.2.0
  firebase_messaging: ^15.2.4
  firebase_auth: ^5.5.1
  bottom_navy_bar: ^6.0.0
  circular_profile_avatar: ^2.0.5
  badges: ^3.0.2
  flutter_rating_bar: ^4.0.1
  geocoding: ^2.1.0
  google_maps_flutter: ^2.5.0
  permission_handler: ^11.3.0
  path_provider: ^2.0.13
#  geolocator: ^14.0.1
  dio: ^5.0.1
  syncfusion_flutter_signaturepad: ^21.1.35
  standard_dialogs: ^2.1.0
  google_place: ^0.4.7 # pour l’autocomplétion d’adresses
  qr_code_scanner: ^1.0.1
#  jiffy: ^6.3.0
  open_filex: ^4.3.4
  #flutter_chat_ui: ^1.6.10
  flutter_chat_types: ^3.6.2
  email_validator: '^2.1.16'
#  maps_launcher: ^2.2.0
  file_picker: ^8.1.7
  insta_image_viewer: ^1.0.2
  flutter_time_picker_spinner: ^2.0.0
  map_launcher: ^3.5.0
  webview_flutter: ^4.7.0
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.5.1
#  app_settings: ^5.2.0
  syncfusion_flutter_datepicker: ^21.1.35
  syncfusion_flutter_core: ^21.1.35
  # UI Plugin --->>
  flutter_switch: ^0.3.2                # for switch
  otp_text_field: ^1.1.1                # To create otp text filed
  image_picker: ^0.8.4+4                # To pick image

  flutter_localizations:
    sdk: flutter

flutter_native_splash:
  color: "#2F2644"
  image: "assets/images/logo.png"
  android_12:
    color: "#42a5f5"
  android: true
  ios: true

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^1.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/on_boarding/
    - assets/icon/

  fonts:
    - family: CarosSoft
      fonts:
        - asset: assets/fonts/CarosSoftBlack.ttf
        - asset: assets/fonts/CarosSoftBold.ttf
        - asset: assets/fonts/CarosSoftExtraBold.ttf
        - asset: assets/fonts/CarosSoftLight.ttf
        - asset: assets/fonts/CarosSoftMedium.ttf
        - asset: assets/fonts/CarosSoftThin.ttf